version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: yudao-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
    ports:
      - "3307:3306"  # 修改端口映射以避免冲突
    volumes:
      - mysql_data:/var/lib/mysql
#      - /opt/yudao/ruoyi-vue-pro/sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yudao-network

  redis:
    image: redis:7-alpine
    container_name: yudao-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # 修改端口映射以避免冲突
    volumes:
      - redis_data:/data
    networks:
      - yudao-network

  server:
    image: ${BACKEND_IMAGE:-registry.cn-beijing.aliyuncs.com/liam_test/ruoyi-vue-pro:latest}
    container_name: yudao-server
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: prod  # 激活生产环境配置
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx1024m"}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: 0
    depends_on:
      - mysql
      - redis
    networks:
      - yudao-network
    volumes:
      - /var/log/yudao/ruoyi-vue-pro:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-registry.cn-beijing.aliyuncs.com/liam_test/yudao-ui-admin-vue3:latest}
    container_name: yudao-frontend
    restart: unless-stopped
    ports:
      - "81:80" # 修改端口映射以避免冲突
    depends_on:
      - server
    networks:
      - yudao-network

networks:
  yudao-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: